services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev
    volumes:
      - ./keycloak-data:/opt/keycloak/data

  connector:
    build: ./connector
    container_name: awsquick-connector
    ports:
      - "8000:8000"
    env_file:
      - .env

  outlook-sim:
    build:
      context: ./outlook-sim
    ports:
      - "8100:8100"

  teams-sim:
    build:
      context: ./teams-sim
    ports:
      - "8200:8200"

  snowflake-sim:
    build:
      context: ./snowflake-sim
    ports:
      - "8300:8300"
